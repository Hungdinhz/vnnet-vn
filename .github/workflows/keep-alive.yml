name: Keep Render Backend Awake

permissions: {}

on:
  schedule:
    # Chạy mỗi 10 phút để giữ Render Free Tier luôn thức (Render sleep sau 15 phút không hoạt động)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging backend server..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://vnnet-vn-java.onrender.com/)
          echo "Response HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Backend is awake and healthy!"
          else
            echo "Warning: Backend returned status $STATUS"
          fi
